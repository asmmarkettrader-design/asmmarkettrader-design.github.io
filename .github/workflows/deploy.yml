name: Deploy to GitHub Pages and SEO Ping

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *' # ہر گھنٹے بعد خود بخود چلے گا (SEO کرالنگ کے لیے)

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # اگر آپ کا پروجیکٹ build فولڈر بناتا ہے تو یہاں dist کی جگہ build لکھ دیں
          branch: gh-pages # یہ ایکشن خود بخود اس برانچ پر ریڈی میڈ فائلیں ڈال دے گا
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Google (SEO Sitemap Ping)
        run: |
          echo "Sending sitemap ping to Google..."
          curl -s "https://www.google.com/ping?sitemap=https://asmveo.com/sitemap.xml"
