name: Production Build, Deploy & Ultimate SEO Indexing

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *' # ہر 1 گھنٹے بعد خود بخود چلے گا تاکہ گوگل کرالرز کو بار بار ریکویسٹ جائے

# گٹ ہب کو فورس کرنا کہ وہ صرف لیٹسٹ نوڈ 24 ہی استعمال کرے
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. گٹ ہب سے کوڈ حاصل کرنا
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. نوڈ جے ایس (Node.js 24) سیٹ اپ کرنا تاکہ فیوچر میں کوڈ خراب نہ ہو
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # 3. پروجیکٹ کی فائلیں انسٹال کرنا
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # 4. پروڈکشن لیول بلڈ تیار کرنا (سائٹ فاسٹ لوڈ ہونے کے لیے)
      - name: Build Project
        run: npm run build

      # 5. گٹ ہب پیجز پر سائٹ لائیو کرنا
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # اگر آپ کا پروجیکٹ Vite پر ہے تو 'dist' رہنے دیں۔ 
          # اگر پروجیکٹ Create React App (CRA) پر ہے تو نیچے dist مٹا کر 'build' لکھ دیں۔
          folder: dist 
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      # 6. گوگل کو انڈیکسنگ اور کرالنگ کے لیے فوراً سگنل بھیجنا
      - name: Send Instant Google Indexing & Sitemap Request
        run: |
          echo "🚀 Initiating Google Crawler Request for asmveo.com..."
          
          # گوگل سائیٹ میپ پنگ ریکویسٹ
          curl -s -I "https://www.google.com/ping?sitemap=https://asmveo.com/sitemap.xml"
          
          # انڈیکسنگ کو تیز کرنے کے لیے مین ڈومین پنگ
          curl -s -I "https://www.google.com/sitemaps/status?sitemap=https://asmveo.com/sitemap.xml"
          
          echo "✅ SEO Ping successfully sent to Google Search Bots!"
