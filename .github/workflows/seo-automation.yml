name: ASM VEO Auto SEO & Deployment

on:
  # یہ کمانڈ ہر روز رات 12 بجے (UTC) سکرپٹ کو خود بخود چلائے گی
  schedule:
    - cron: '0 0 * * *'
  # یہ کمانڈ آپ کو گٹ ہب پر بٹن دبا کر مینوئل (Manual) سکرپٹ چلانے کی سہولت دے گی
  workflow_dispatch: 

permissions:
  contents: write # تاکہ نیا کوڈ GitHub Pages پر پش کیا جا سکے

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies (لائبریریز انسٹال کریں)
        run: |
          python -m pip install --upgrade pip
          # ہم گوگل کی APIs اور دیگر ضروری پیکجز انسٹال کر رہے ہیں
          pip install requests beautifulsoup4 google-auth google-auth-httplib2 google-auth-oauthlib google-api-python-client

      - name: Setup GCP Credentials (گوگل کلاؤڈ کی چابی سیٹ کریں)
        env:
          GCP_KEY: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_KEY" > gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="gcp-key.json"

      - name: Run Advanced SEO Script (آپ کا پائتھن سکرپٹ چلائیں)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "gcp-key.json"
        run: |
          python src/main.py

      - name: Deploy to GitHub Pages (ویب سائٹ لائیو کریں)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output  # صرف output فولڈر کی فائلز لائیو ہوں گی۔
          commit_message: "🚀 Auto-deployed SEO updates, Trending Keywords & fixed broken links"
