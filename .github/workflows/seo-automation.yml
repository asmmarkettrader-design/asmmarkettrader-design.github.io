name: ASM VEO Auto SEO & Deployment

on:
  # Daily build at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-auth google-auth-httplib2 google-auth-oauthlib google-api-python-client

      - name: Setup GCP Credentials
        env:
          GCP_KEY: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          if [ -n "$GCP_KEY" ]; then
            printf '%s' "$GCP_KEY" > gcp-key.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/gcp-key.json" >> "$GITHUB_ENV"
          else
            echo "GCP_CREDENTIALS secret is not configured; continuing without it."
          fi

      - name: Run Advanced SEO Script
        run: python src/main.py
        env:
          PRODUCT_CSV: woocommerce-products-export.csv

      # main.py writes controls into numbered subfolders (0000-0999, 1000-1999, ...)
      # and recreates them from the CSV if the old files were deleted.
      - name: Verify and Commit Individual Product Control Files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d product-prices ]; then
            echo "::error::product-prices/ was not created by src/main.py."
            exit 1
          fi

          CONTROL_COUNT="$(find product-prices -type f -name '*.txt' -print | wc -l | tr -d ' ')"
          if [ "$CONTROL_COUNT" -eq 0 ]; then
            echo "::error::No individual product control files were generated under product-prices/."
            echo "Check that woocommerce-products-export.csv exists and contains valid product rows."
            exit 1
          fi

          if [ ! -s product-prices.txt ]; then
            echo "::error::product-prices.txt index was not created or is empty."
            exit 1
          fi

          echo "Individual product control files (recursive): $CONTROL_COUNT"
          echo "Numbered folders:"
          find product-prices -mindepth 1 -maxdepth 1 -type d -print | sort

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-prices/ product-prices.txt

          if git diff --cached --quiet; then
            echo "Product control files are unchanged; no repository commit needed."
          else
            git commit -m "Save ASM VEO individual product controls"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Product controls committed to ${GITHUB_REF_NAME}."
          fi

      - name: Verify Output Price Sheet
        run: |
          set -euo pipefail
          if [ ! -s output/product-prices.txt ]; then
            echo "::error::output/product-prices.txt is missing or empty."
            exit 1
          fi
          echo "Output copy verified."

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          commit_message: "Deploy ASM VEO website"
