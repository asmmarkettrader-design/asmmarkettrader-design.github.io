name: ASM VEO Auto SEO & Deployment

on:
  # Daily build at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-auth google-auth-httplib2 google-auth-oauthlib google-api-python-client

      - name: Setup GCP Credentials
        env:
          GCP_KEY: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          if [ -n "$GCP_KEY" ]; then
            printf '%s' "$GCP_KEY" > gcp-key.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/gcp-key.json" >> "$GITHUB_ENV"
          else
            echo "GCP_CREDENTIALS secret is not configured; continuing without it."
          fi

      - name: Run Advanced SEO Script
        run: python src/main.py
        env:
          PRODUCT_CSV: woocommerce-products-export.csv

      # Save the editable per-product control files in the source repository.
      # They are intentionally NOT copied into the public ./output website.
      - name: Commit individual product control files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d product-prices ] || [ -z "$(find product-prices -maxdepth 1 -type f -name '*.txt' -print -quit)" ]; then
            echo "::error::product-prices/ is missing or contains no product files."
            exit 1
          fi
          if [ ! -s product-prices.txt ]; then
            echo "::error::product-prices.txt index was not created or is empty."
            exit 1
          fi

          echo "Individual product files: $(find product-prices -maxdepth 1 -type f -name '*.txt' | wc -l)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-prices/ product-prices.txt

          if git diff --cached --quiet; then
            echo "Product control files are unchanged; no repository commit needed."
          else
            git commit -m "Save ASM VEO individual product controls"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Product controls committed to ${GITHUB_REF_NAME}."
          fi

      - name: Verify Output Price Sheet
        run: |
          if [ ! -s output/product-prices.txt ]; then
            echo "::error::output/product-prices.txt is missing or empty."
            exit 1
          fi
          echo "Output copy verified."

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          commit_message: "Deploy ASM VEO website"
