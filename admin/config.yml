backend:
  name: github
  repo: asmmarkettrader-design/asmmarkettrader-design.github.io
  branch: main
  site_url: https://www.asmveo.com
  # یہ لائنز گٹ ہب کو بتائیں گی کہ لاگ ان اسی پیج پر ہینڈل کرنا ہے
  auth_endpoint: https://github.com/login/oauth/authorize

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    folder: "_pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }
