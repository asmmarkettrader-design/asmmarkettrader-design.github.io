<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asmveo - Content Manager</title>
    
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    
    <script>
      // جیسے ہی پیج لوڈ ہوگا، یہ کوڈ لاگ ان سسٹم کو آپ کے نیٹلی فائی اکاؤنٹ سے جوڑ دے گا
      document.addEventListener("DOMContentLoaded", () => {
        if (window.netlifyIdentity) {
          // ⚠️ نیچے والی لائن میں اپنی سائٹ کا اصل نیٹلی فائی لنک ڈالیں (جیسے: your-site.netlify.app)
          window.netlifyIdentity.init({
            APIUrl: "https://asmmarkettrader-design-github-io.netlify.app/.netlify/identity"
          });

          window.netlifyIdentity.on("init", user => {
            if (!user) {
              window.netlifyIdentity.on("login", () => {
                document.location.href = "/admin/";
              });
            }
          });
        }
      });
    </script>
  </body>
</html>
