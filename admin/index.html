<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asmveo - Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; direction: rtl; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        h2 { margin-bottom: 20px; color: #333; font-size: 22px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-align: right; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .error { color: #dc3545; font-size: 14px; margin-top: 10px; display: none; font-weight: bold; }
        .dashboard { display: none; background: white; padding: 40px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); text-align: center; width: 80%; max-width: 600px; }
    </style>
</head>
<body>

<div class="login-box" id="loginSection">
    <h2>ایڈمن لاگ ان پینل</h2>
    <input type="text" id="username" placeholder="یوزر نیم درج کریں">
    <input type="password" id="password" placeholder="پاسورڈ درج کریں">
    <button onclick="checkLogin()">لاگ ان کریں</button>
    <div class="error" id="errorMsg">غلط یوزر نیم یا پاسورڈ! دوبارہ کوشش کریں۔</div>
</div>

<div class="dashboard" id="dashboardSection">
    <h2>خوش آمدید! آپ کامیابی سے لاگ ان ہو چکے ہیں 🎉</h2>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    <p style="font-size: 16px; color: #555;">یہ آپ کا ذاتی خفیہ ایڈمن ایریا ہے۔ اب یہاں کوئی ڈیکاپ یا نیٹلی فائی شو نہیں ہوگا۔</p>
    <br>
    <button onclick="logout()" style="background-color: #dc3545; width: auto; padding: 10px 20px;">لاگ آؤٹ کریں</button>
</div>

<script>
    function checkLogin() {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;

        // ⚠️ یہاں آپ اپنا یوزر نیم اور پاسورڈ تبدیل کر سکتے ہیں
        if (user === "admin" && pass === "Asmveo@2026") {
            localStorage.setItem("myPrivateLogin", "success");
            showDashboard();
        } else {
            document.getElementById("errorMsg").style.display = "block";
        }
    }

    function showDashboard() {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("dashboardSection").style.display = "block";
    }

    function logout() {
        localStorage.removeItem("myPrivateLogin");
        location.reload();
    }

    // چیک کریں کہ کیا یوزر پہلے سے لاگ ان ہے
    if (localStorage.getItem("myPrivateLogin") === "success") {
        showDashboard();
    }
</script>

</body>
</html>
