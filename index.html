<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASM Digital Solutions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            line-height: 1.6;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 14, 39, 0.95);
            border-bottom: 1px solid #1a2f5f;
            padding: 1rem 2rem;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00f2fe;
        }

        nav a {
            color: #e0e0e0;
            text-decoration: none;
            margin: 0 1.5rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #00f2fe;
        }

        .btn-login {
            padding: 0.6rem 1.2rem;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #0a0e27;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-login:hover {
            opacity: 0.8;
        }

        .hero {
            margin-top: 80px;
            padding: 5rem 2rem;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #00f2fe;
        }

        .hero p {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 2rem;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .btn-primary {
            padding: 0.9rem 2rem;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #0a0e27;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
        }

        .btn-secondary {
            padding: 0.9rem 2rem;
            background: transparent;
            color: #00f2fe;
            border: 2px solid #00f2fe;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-secondary:hover {
            background: rgba(0, 242, 254, 0.1);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 2rem;
            margin: 3rem 2rem;
            padding: 2rem;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .stat-item {
            text-align: center;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #1a2f5f;
            border-radius: 8px;
        }

        .stat-number {
            font-size: 2rem;
            color: #00f2fe;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .services {
            padding: 4rem 2rem;
            background: rgba(15, 20, 40, 0.8);
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-header h2 {
            font-size: 2.5rem;
            color: #00f2fe;
            margin-bottom: 1rem;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #1a2f5f;
            border-radius: 8px;
            padding: 2rem;
            transition: all 0.3s;
        }

        .service-card:hover {
            background: rgba(0, 242, 254, 0.08);
            border-color: #00f2fe;
            transform: translateY(-5px);
        }

        .service-card h3 {
            color: #00f2fe;
            margin-bottom: 1rem;
        }

        .service-card p {
            color: #a0a0a0;
        }

        .portfolio {
            padding: 4rem 2rem;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .portfolio-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #1a2f5f;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .portfolio-item:hover {
            border-color: #00f2fe;
            transform: translateY(-5px);
        }

        .portfolio-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .portfolio-content {
            padding: 1.5rem;
        }

        .portfolio-content h3 {
            color: #00f2fe;
            margin-bottom: 0.5rem;
        }

        .portfolio-content p {
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .reviews {
            padding: 4rem 2rem;
            background: rgba(15, 20, 40, 0.8);
        }

        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .review-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #1a2f5f;
            border-radius: 8px;
            padding: 2rem;
            transition: all 0.3s;
        }

        .review-card:hover {
            background: rgba(0, 242, 254, 0.08);
            border-color: #00f2fe;
        }

        .review-stars {
            color: #ffc107;
            margin-bottom: 1rem;
        }

        .review-text {
            color: #a0a0a0;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .review-author {
            color: #00f2fe;
            font-weight: bold;
        }

        .contact {
            padding: 4rem 2rem;
            text-align: center;
        }

        .contact h2 {
            font-size: 2.5rem;
            color: #00f2fe;
            margin-bottom: 2rem;
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            max-width: 1000px;
            margin: 0 auto 2rem;
        }

        .contact-item {
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #1a2f5f;
            border-radius: 8px;
        }

        .contact-item h3 {
            color: #00f2fe;
            margin-bottom: 0.5rem;
        }

        .contact-item p {
            color: #a0a0a0;
        }

        .admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .admin-modal.active {
            display: flex;
        }

        .modal-content {
            background: #0a0e27;
            border: 2px solid #00f2fe;
            border-radius: 8px;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
        }

        .modal-content h2 {
            color: #00f2fe;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #a0a0a0;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #1a2f5f;
            border-radius: 5px;
            color: #e0e0e0;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00f2fe;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-submit {
            flex: 1;
            padding: 0.8rem;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #0a0e27;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cancel {
            flex: 1;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid #1a2f5f;
            border-radius: 5px;
            cursor: pointer;
        }

        .admin-bar {
            display: none;
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            background: rgba(139, 92, 246, 0.1);
            border-bottom: 2px solid #8b5cf6;
            padding: 1rem 2rem;
            z-index: 999;
        }

        .admin-bar.active {
            display: block;
        }

        .admin-bar-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .admin-bar input {
            padding: 0.6rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #8b5cf6;
            border-radius: 5px;
            color: #e0e0e0;
            flex: 1;
            min-width: 150px;
        }

        .admin-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .admin-btn {
            padding: 0.6rem 1rem;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .admin-btn:hover {
            background: #00f2fe;
            color: #0a0e27;
        }

        footer {
            padding: 2rem;
            text-align: center;
            color: #a0a0a0;
            border-top: 1px solid #1a2f5f;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
            }

            nav {
                flex-direction: column;
                text-align: center;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .section-header h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<!-- HEADER -->
<header>
    <div class="logo">ASM Digital Solutions</div>
    <nav>
        <a href="#home">Home</a>
        <a href="#services">Services</a>
        <a href="#portfolio">Portfolio</a>
        <a href="#reviews">Reviews</a>
        <a href="#contact">Contact</a>
        <button class="btn-login" onclick="openAdminModal()">Admin</button>
    </nav>
</header>

<!-- ADMIN LOGIN MODAL -->
<div class="admin-modal" id="adminModal">
    <div class="modal-content">
        <h2>System Login</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="adminUsername" placeholder="Enter username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="adminPassword" placeholder="Enter password">
        </div>
        <div class="form-group">
            <label>GitHub Token (Optional)</label>
            <input type="text" id="githubToken" placeholder="Paste your GitHub token">
        </div>
        <div class="modal-buttons">
            <button class="btn-submit" onclick="loginAdmin()">Login</button>
            <button class="btn-cancel" onclick="closeAdminModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- ADMIN BAR -->
<div class="admin-bar" id="adminBar">
    <div class="admin-bar-content">
        <input type="text" id="editableText" placeholder="Click an element to edit...">
        <div class="admin-buttons">
            <button class="admin-btn" onclick="enableEditMode()">Edit Mode</button>
            <button class="admin-btn" onclick="saveChanges()">Save Changes</button>
            <button class="admin-btn" onclick="logoutAdmin()">Logout</button>
        </div>
    </div>
</div>

<!-- HERO SECTION -->
<section class="hero" id="home">
    <h1>Architecting Elite Platforms</h1>
    <p>We build specialized, high-performance software frameworks and deploy geo-targeted solutions engineered to dominate</p>
    <div class="hero-buttons">
        <button class="btn-primary" onclick="scrollTo('services')">Explore Services</button>
        <button class="btn-secondary" onclick="scrollTo('contact')">Get in Touch</button>
    </div>

    <div class="stats">
        <div class="stat-item">
            <div class="stat-number">100%
